{% extends "admin/dashboard.html" %}
{% block content  %}
    <div class="md:w-1/2 mx-auto my-8">
            <ul>
                {% for message in messages %}
                    <li class="bg-green-500 py-2 px-1 ">{{message}}</li>
                {% endfor %}
            </ul>
            <form method="post" >
                {% csrf_token %}
                {{form}}
                <button type="submit" class="px-2 py-1 bg-blue-500 rounded  my-3 text-white">Submit</button>
            </form>
    </div>
{% endblock content  %}
