{% extends "admin/dashboard.html" %}
{% block content  %}
    <ul>
        {% for message in messages %}
            <li class="bg-green-500 py-2 px-1 ">{{message}}</li>
        {% endfor %}
    </ul>
    <form method="post" class="md:w-1/2 mx-auto my-8">
        {% csrf_token %}
        {{form}}
        <button type="submit" class="px-2 py-1 bg-blue-500 rounded  my-3 text-white">Create Group</button>
    </form>
{% endblock content  %}
